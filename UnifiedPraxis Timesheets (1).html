<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>UnifiedPraxis Timesheets</title>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
:root{--bg:#edf5f9;--card:#fff;--ink:#000;--mute:#3d4b57;--line:#cfdde6;--blue:#0277B6;--green:#008001;--orange:#FF7518;--head:#008001;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root{color-scheme:light}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:300 15px/1.5 Comfortaa,system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#fff}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:#fff}header::after{content:"";display:block;height:4px;background:linear-gradient(90deg,#0277B6 33.34%,#008001 33.34% 66.67%,#FF7518 66.67%)}
.bar,main{max-width:900px;margin:0 auto;padding:12px 16px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{font-size:18px;margin:0;font-weight:700;color:#000}.brand{display:flex;align-items:center;gap:14px}.brand img{width:128px;height:auto;display:block}.brand h1{padding-left:14px;border-left:1px solid #cfdde6}
h2{font-size:17px;margin:0 0 14px;font-weight:700;color:var(--head)}.card>h2::after{content:"";display:block;width:36px;height:3px;border-radius:2px;background:var(--blue);margin-top:6px}
nav{display:flex;gap:4px;background:#edf5f9;padding:3px;border-radius:8px}
nav button{border:0;background:none;color:#3d4b57;padding:7px 14px;border-radius:6px;cursor:pointer}
nav button.on{background:#0277B6;color:#fff}
button{font:700 14px Comfortaa,sans-serif;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 14px;border-radius:6px;cursor:pointer}
button.pri{background:#0277B6;border-color:#0277B6;color:#fff}
button.ghost{border-color:transparent;color:var(--mute);padding:6px 8px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
label{display:grid;gap:4px;font-size:13px;color:var(--mute);margin-bottom:12px}
input,select{font:400 16px Comfortaa,sans-serif;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:9px 10px;width:100%;min-width:0}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 12px}
.sm{max-width:200px}
.hint{color:var(--mute);font-size:13px;margin:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{padding:5px 10px;font-size:13px;border-radius:99px}
.mbar{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.mbar h2{margin:0;font-size:20px;flex:1}
.mbar button{width:38px;padding:6px}
.sub{color:var(--mute);margin:-6px 0 12px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{font-style:normal;text-align:center;font-size:12px;color:var(--mute)}
.day{position:relative;display:grid;gap:0;justify-items:center;padding:5px 0;min-height:46px;border-radius:6px;overflow:hidden;background:var(--bg)}
.day::before{content:"";position:absolute;inset:0;background:var(--green);opacity:var(--a,0)}
.day>*{position:relative}
.day span{font-size:12px;min-height:16px}
.day.we b{color:var(--mute)}
.day.td{border-color:var(--orange)}
.day.sel{outline:2px solid var(--blue);outline-offset:1px}
.dayg{margin-bottom:12px}
.dh{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:4px;font-weight:600}
.ent{display:grid;grid-template-columns:1fr auto auto;gap:8px 12px;align-items:start;padding:8px 0}
.ent p{margin:0;color:var(--mute)}
.eh{font-variant-numeric:tabular-nums;font-weight:500}
.ea{display:flex}
.cl{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:0 12px;align-items:end;border-top:1px solid var(--line);padding-top:12px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.chk{display:flex;align-items:center;gap:8px}
.chk input{width:auto}
.empty{text-align:center;padding:32px 16px}
.paper{background:#fff;color:#111;border:1px solid var(--line);border-radius:4px;padding:20px;font-family:Calibri,Carlito,Arial,sans-serif;overflow-x:auto}
.paper dl{display:grid;grid-template-columns:max-content 1fr;gap:2px 16px;margin:0 0 16px}
.paper dt{font-weight:700}
.plogo{display:block;width:165px;height:auto;margin:0 0 14px}
.paper dd{margin:0}
.ph{color:#792910;font-style:italic}
.paper table{border-collapse:collapse;width:100%;min-width:480px;text-align:center}
.paper th,.paper td{border:1px solid #222;padding:3px 8px}
.paper th{background:#d9d9d9}
.paper td:last-child{text-align:left}
.paper .nn{text-align:center;color:#555}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;z-index:20}
#toast.on{opacity:1}
footer{text-align:center;color:var(--mute);font-size:12px;padding:0 16px 24px}
@media print{.np,header,footer,#toast{display:none!important}body{background:#fff}main{padding:0}.paper{border:0}}
</style>
</head>

<main id="app"></main>
<footer id="status">Saved on this device</footer>
<div id="toast" role="status"></div>

const $=s=>document.querySelector(s),app=$("#app");
const pad=n=>String(n).padStart(2,"0"),iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const today=iso(new Date()),r2=x=>Math.round(x*100)/100,uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const parse=s=>{const a=s.split("-").map(Number);return new Date(a[0],a[1]-1,a[2])};
const dm=s=>{const d=parse(s);return d.getDate()+"-"+MON[d.getMonth()]};
const longDate=s=>{const d=parse(s);return d.getDate()+" "+MON[d.getMonth()]+" "+d.getFullYear()};
const wk=s=>{const d=parse(s),f=new Date(d.getFullYear(),d.getMonth(),1);return Math.floor((d.getDate()-1+(f.getDay()+6)%7)/7)+1};
const blank=()=>({p:{name:"",sup:"",dh:8},c:[],e:[],m:{}});
let S=blank(),tab="log",auto=false,ym=today.slice(0,7),sc="",showH=false,ref=null,st;
let F={d:today,c:"",h:"",t:"",id:null};
try{const s=localStorage.getItem(KEY);if(s)S=Object.assign(blank(),JSON.parse(s))}catch(e){}
if(!S.c.length){tab="setup";auto=true}

function say(t){$("#status").textContent=t}
function toast(t){const e=$("#toast");e.textContent=t;e.classList.add("on");clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove("on"),2600)}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  clearTimeout(st);st=setTimeout(async()=>{if(!ref)return;try{await ref.set(JSON.parse(JSON.stringify(S)));say("Saved to your account")}catch(e){say("Saved on this device only")}},500);
}
async function initDb(){
  try{
    if(!window.claude)return;
    const d=await claude.use("db"),u=await claude.use("user");if(!d||!u)return;
    const id=await u.id();if(!id)return;
    ref=d.collection("data/users/"+id).doc("app");
    const s=await ref.get();
    if(s.exists){S=Object.assign(blank(),s.data());if(auto&&S.c.length)tab="log";render()}else if(S.c.length||S.e.length)save();
    say("Saved to your account");
  }catch(e){}
}

const cname=id=>(S.c.find(c=>c.id===id)||{}).name||"Unnamed client";
const monthEntries=cid=>S.e.filter(e=>e.d.startsWith(ym)&&(!cid||e.c===cid));
const mlabel=()=>{const a=ym.split("-");return new Date(a[0],a[1]-1,1).toLocaleDateString("en-GB",{month:"long",year:"numeric"})};
const period=()=>{const a=ym.split("-").map(Number),n=new Date(a[0],a[1],0).getDate();return "1 "+MON[a[1]-1]+" – "+n+" "+MON[a[1]-1]+" "+a[0]};
const mm=()=>S.m[sc+":"+ym]||(S.m[sc+":"+ym]={});
const opts=(v)=>S.c.map(c=>`<option value="${c.id}"${c.id===v?" selected":""}>${esc(c.name||"Unnamed client")}</option>`).join("");
function mbar(){return `<div class="mbar np"><button data-m="-1" aria-label="Previous month">‹</button><h2>${mlabel()}</h2><button data-m="1" aria-label="Next month">›</button></div>`}

function cal(){
  const a=ym.split("-").map(Number),n=new Date(a[0],a[1],0).getDate(),lead=(new Date(a[0],a[1]-1,1).getDay()+6)%7,by={};
  monthEntries().forEach(e=>by[e.d]=(by[e.d]||0)+e.h);
  let h=["M","T","W","T","F","S","S"].map(d=>`<i class="dow">${d}</i>`).join("")+"<i></i>".repeat(lead);
  for(let d=1;d<=n;d++){const s=ym+"-"+pad(d),v=by[s]||0,al=v?0.2+0.4*Math.min(1,v/S.p.dh):0;
    h+=`<button class="day${(lead+d-1)%7>4?" we":""}${s===F.d?" sel":""}${s===today?" td":""}" data-d="${s}" style="--a:${al}" aria-label="${d} ${mlabel()}, ${r2(v)} hours"><b>${d}</b><span>${v?r2(v):""}</span></button>`}
  return `<div class="cal">${h}</div>`;
}

function viewLog(){
  if(!S.c.length)return `<section class="card empty"><h2>Add your first client</h2><p class="hint">Time is logged against a client organisation. Add one in Setup, then come back to log your day.</p><br><button class="pri" data-t="setup">Go to Setup</button></section>`;
  if(!S.c.some(c=>c.id===F.c))F.c=S.c[0].id;
  const es=monthEntries(),tot=es.reduce((a,e)=>a+e.h,0),days=[...new Set(es.map(e=>e.d))].sort().reverse();
  const chips=[0.5,1,2,4].map(h=>`<button data-h="${h}">${h}h</button>`).join("")+`<button data-h="${S.p.dh}">Full day (${S.p.dh}h)</button>`;
  return mbar()+`<p class="sub np">${tot?r2(tot)+" hours logged over "+days.length+(days.length===1?" day":" days")+", which is "+r2(tot/S.p.dh)+" working days.":"Nothing logged yet this month."}</p>
  <section class="card np">${cal()}</section>
  <section class="card np"><h2>${F.id?"Edit entry":"Log time"}</h2>
  <div class="row"><label>Date<input type="date" id="fd" value="${F.d}"></label><label>Client<select id="fc">${opts(F.c)}</select></label></div>
  <label>Hours<input type="number" id="fh" step="0.25" min="0" max="24" inputmode="decimal" value="${F.h}" placeholder="e.g. 2.5"></label>
  <div class="chips" style="margin:-4px 0 12px">${chips}</div>
  <label>What did you work on?<input id="ft" maxlength="140" value="${esc(F.t)}" placeholder="Migrated mailboxes, fixed VPN drop-outs"></label>
  <div class="acts"><button class="pri" id="add">${F.id?"Save changes":"Add entry"}</button>${F.id?`<button id="cancel">Cancel</button>`:""}</div></section>
  <section class="card np"><h2>Entries</h2>${days.length?days.map(d=>{const l=es.filter(e=>e.d===d);
    return `<div class="dayg"><div class="dh"><span>${parse(d).toLocaleDateString("en-GB",{weekday:"short"})} ${dm(d)}</span><span>${r2(l.reduce((a,e)=>a+e.h,0))} h</span></div>`+l.map(e=>`<div class="ent"><div><strong>${esc(cname(e.c))}</strong><p>${esc(e.t)||"No description"}</p></div><div class="eh">${r2(e.h)} h</div><div class="ea"><button class="ghost" data-ed="${e.id}">Edit</button><button class="ghost" data-del="${e.id}">Delete</button></div></div>`).join("")+`</div>`}).join(""):`<p class="hint">No entries for ${mlabel()}. Pick a day above and log your first one.</p>`}</section>`;
}

function build(){
  const by={};monthEntries(sc).forEach(e=>{const b=by[e.d]||(by[e.d]={h:0,t:[]});b.h+=e.h;if(e.t)b.t.push(e.t)});
  return Object.keys(by).sort().map(d=>({w:wk(d),d,h:r2(by[d].h),days:r2(by[d].h/S.p.dh),n:by[d].t.join("; ")}));
}
const totals=rows=>({h:r2(rows.reduce((a,r)=>a+r.h,0)),d:r2(rows.reduce((a,r)=>a+r.days,0))});

function viewSheet(){
  if(!S.c.length)return viewLog();
  if(!S.c.some(c=>c.id===sc))sc=S.c[0].id;
  const cl=S.c.find(c=>c.id===sc),m=mm(),rows=build(),T=totals(rows),sub=m.sub||today;
  const hd=[["Invoice Reference",m.inv],["SOW Reference",cl.sow],["PO Number",cl.po],["Supplier",S.p.sup],["Period",period()],["Submission Date",longDate(sub)],["TimeSheet for",cl.name],["Consultant Name",S.p.name]];
  const nc=showH?5:4;
  return mbar()+`<section class="card np"><div class="row"><label>Client<select id="sc">${opts(sc)}</select></label><label>Invoice reference<input id="inv" value="${esc(m.inv)}"></label><label>Submission date<input type="date" id="sub" value="${sub}"></label></div>
  <label class="chk"><input type="checkbox" id="sh"${showH?" checked":""}>Show an hours column</label>
  <div class="acts"><button class="pri" id="xl">Download Excel</button><button id="pr">Print</button></div></section>
  <div class="paper"><img class="plogo" src="${LOGO_FULL}" alt="UnifiedPraxis"><dl>${hd.map(h=>`<dt>${h[0]}</dt><dd>${esc(h[1])||`<span class="ph">Not set</span>`}</dd>`).join("")}</dl>
  <table><thead><tr><th>Week No.</th><th>Date</th>${showH?"<th>Hours</th>":""}<th>Day Recorded</th><th>Notes</th></tr></thead><tbody>
  ${rows.length?rows.map(r=>`<tr><td>${r.w}</td><td>${dm(r.d)}</td>${showH?`<td>${r.h}</td>`:""}<td>${r.days}</td><td>${esc(r.n)}</td></tr>`).join(""):`<tr><td colspan="${nc}" class="nn">Nothing logged for ${esc(cl.name||"this client")} in ${mlabel()}.</td></tr>`}
  </tbody><tfoot><tr><td></td><td>Total Number of Days</td>${showH?`<td>${T.h}</td>`:""}<td><b>${T.d}</b></td><td></td></tr></tfoot></table></div>`;
}

function viewSetup(){
  return `<section class="card"><h2>About you</h2><div class="row"><label>Your name<input data-p="name" value="${esc(S.p.name)}"></label><label>Your company (supplier)<input data-p="sup" value="${esc(S.p.sup)}"></label></div>
  <label class="sm">Hours in a working day<input type="number" step="0.25" min="1" max="24" data-p="dh" value="${S.p.dh}"></label>
  <p class="hint">Timesheets record days, so hours are divided by this number. With an 8-hour day, 2 hours is 0.25 days.</p></section>
  <section class="card"><h2>Clients</h2>${S.c.map(c=>`<div class="cl"><label>Organisation<input data-c="${c.id}|name" value="${esc(c.name)}"></label><label>SOW reference<input data-c="${c.id}|sow" value="${esc(c.sow)}"></label><label>PO number<input data-c="${c.id}|po" value="${esc(c.po)}"></label><label><button class="ghost" data-rc="${c.id}">Remove</button></label></div>`).join("")}
  <div style="margin-top:12px"><button class="pri" id="ac">Add client</button></div></section>`;
}

function render(){
  document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===tab));
  app.innerHTML=tab==="log"?viewLog():tab==="sheet"?viewSheet():viewSetup();
}

function shift(n){const a=ym.split("-").map(Number),d=new Date(a[0],a[1]-1+n,1);ym=d.getFullYear()+"-"+pad(d.getMonth()+1);F.d=ym===today.slice(0,7)?today:ym+"-01";render()}

function addEntry(){
  const h=parseFloat(F.h);
  if(!F.d||!F.c||!(h>0)||h>24)return toast("Add a date, a client and hours between 0 and 24.");
  const o={id:F.id||uid(),d:F.d,c:F.c,h:r2(h),t:F.t.trim()};
  if(F.id)S.e=S.e.map(x=>x.id===F.id?o:x);else S.e.push(o);
  toast(F.id?"Entry updated":"Entry added");F.id=null;F.h="";F.t="";save();render();
}

async function exportXlsx(){
  const rows=build();if(!rows.length)return toast("Nothing logged for this client this month.");
  if(!window.ExcelJS)return toast("The Excel library didn’t load. Check your connection and reload.");
  let dl=null;try{dl=await claude.use("downloads")}catch(e){}
  if(!dl)return toast("Downloads aren’t available here. Try Print instead.");
  try{
    const cl=S.c.find(c=>c.id===sc),m=mm(),T=totals(rows),nc=showH?5:4,dc=showH?4:3,col=String.fromCharCode(64+dc);
    const wb=new ExcelJS.Workbook(),ws=wb.addWorksheet("Timesheet",{views:[{showGridLines:false}]});
    ws.columns=[{width:20},{width:24}].concat(showH?[{width:10}]:[],[{width:15},{width:70}]);
    for(let r=1;r<=5;r++)ws.getRow(r).height=16;
    ws.addImage(wb.addImage({base64:LOGO_FULL,extension:"png"}),{tl:{col:0,row:0},ext:{width:165,height:Math.round(165*429/720)}});
    const hd=[["Invoice Reference",m.inv||""],["SOW Reference",cl.sow],["PO Number",cl.po],["Supplier",S.p.sup],["Period",period()],["Submission Date",longDate(m.sub||today)],["TimeSheet for",cl.name],["Consultant Name",S.p.name]];
    hd.forEach((h,i)=>{const a=ws.getCell(6+i,1),v=ws.getCell(6+i,2);a.value=h[0];a.font={bold:true};v.value=h[1]||"";v.alignment={horizontal:"left"}});
    const bd={style:"thin",color:{argb:"FF000000"}},box={top:bd,left:bd,bottom:bd,right:bd};
    const put=(r,vals,head)=>vals.forEach((v,i)=>{const c=ws.getCell(r,i+1);c.value=v;c.border=box;c.alignment={horizontal:i===nc-1?"left":"center",vertical:"middle",wrapText:i===nc-1};if(head){c.font={bold:true};c.fill={type:"pattern",pattern:"solid",fgColor:{argb:"FFD9D9D9"}}}});
    put(15,["Week No.","Date"].concat(showH?["Hours"]:[],["Day Recorded","Notes"]),true);
    rows.forEach((r,i)=>put(16+i,[r.w,dm(r.d)].concat(showH?[r.h]:[],[r.days,r.n])));
    const tr=16+rows.length;
    put(tr,["","Total Number of Days"].concat(showH?[T.h]:[],[{formula:"SUM("+col+"16:"+col+(tr-1)+")",result:T.d},""]));
    ws.getCell(tr,dc).font={bold:true};
    const buf=await wb.xlsx.writeBuffer();
    const fn=("Timesheet_"+(cl.name||"client")+"_"+ym+".xlsx").replace(/[^\w.-]+/g,"_");
    await dl.save({filename:fn,data:new Blob([buf])});toast("Timesheet saved");
  }catch(e){if(!e||e.code!=="declined")toast("Couldn’t save the file. Try again.")}
}

document.querySelector("nav").addEventListener("click",e=>{const t=e.target.closest("button");if(t){tab=t.dataset.t;auto=false;render();window.scrollTo(0,0)}});
app.addEventListener("input",e=>{const t=e.target;if(t.id==="fh")F.h=t.value;else if(t.id==="ft")F.t=t.value});
app.addEventListener("change",e=>{
  const t=e.target,D=t.dataset;
  if(t.id==="fd"){F.d=t.value;if(t.value&&t.value.slice(0,7)!==ym){ym=t.value.slice(0,7);render()}}
  else if(t.id==="fc")F.c=t.value;
  else if(t.id==="sc"){sc=t.value;render()}
  else if(t.id==="inv"){mm().inv=t.value.trim();save();render()}
  else if(t.id==="sub"){if(t.value){mm().sub=t.value;save();render()}}
  else if(t.id==="sh"){showH=t.checked;render()}
  else if(D.p){S.p[D.p]=D.p==="dh"?Math.min(24,Math.max(1,parseFloat(t.value)||8)):t.value.trim();save()}
  else if(D.c){const a=D.c.split("|"),c=S.c.find(x=>x.id===a[0]);if(c){c[a[1]]=t.value.trim();save()}}
});
app.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;const D=t.dataset;
  if(D.t){tab=D.t;render()}
  else if(D.m)shift(+D.m);
  else if(D.d){F.d=D.d;render()}
  else if(D.h){F.h=D.h;render();$("#ft").focus()}
  else if(t.id==="add")addEntry();
  else if(t.id==="cancel"){F.id=null;F.h="";F.t="";render()}
  else if(D.ed){const x=S.e.find(y=>y.id===D.ed);if(x){F={d:x.d,c:x.c,h:x.h,t:x.t,id:x.id};ym=x.d.slice(0,7);render();window.scrollTo(0,0)}}
  else if(D.del||D.rc){
    if(t.dataset.arm!=="1"){t.dataset.arm="1";t.textContent="Click again to confirm";return}
    if(D.del)S.e=S.e.filter(x=>x.id!==D.del);
    else{S.c=S.c.filter(x=>x.id!==D.rc);S.e=S.e.filter(x=>x.c!==D.rc)}
    save();render();toast("Deleted");
  }
  else if(t.id==="ac"){S.c.push({id:uid(),name:"",sow:"",po:""});save();render()}
  else if(t.id==="xl")exportXlsx();
  else if(t.id==="pr"){try{window.print()}catch(x){toast("Printing is blocked here. Download the Excel file instead.")}}
});
$("#logo").src=LOGO_ICON;render();initDb();
</script>
</body>
</html>
